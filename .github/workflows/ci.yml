name: Congratis CI

on:
  push:
    branches:
      - main
      - feat/backend-auth
      - feat/dominator-spa
      - feat/rethinkdb-sse
  pull_request:
    branches:
      - main
      - feat/rethinkdb-sse
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: congratis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.manual.outputs.frontend || steps.filter.outputs.frontend }}
      backend: ${{ steps.manual.outputs.backend || steps.filter.outputs.backend }}
      infrastructure: ${{ steps.manual.outputs.infrastructure || steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'web/**'
              - 'frontend/**'
              - '.github/workflows/**'
            backend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'src/**'
              - 'tests/**'
              - '.github/workflows/**'
            infrastructure:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - '.env.example'
              - 'deploy/**'
              - 'scripts/**'
              - '.github/workflows/**'
      - name: Run all component checks for scheduled and manual builds
        id: manual
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "infrastructure=true" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend · Rust/WASM + Rollup + Playwright
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web -> web/target
      - name: Compile Dominator frontend
        run: cargo check --manifest-path web/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Lint Dominator frontend
        run: cargo clippy --manifest-path web/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Check WASM formatting
        run: cargo fmt --manifest-path web/Cargo.toml -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build frontend with Rollup
        working-directory: web
        run: npm run build
      - name: Prepare browser test site
        working-directory: web
        run: npm run prepare:e2e
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run frontend browser tests
        working-directory: web
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: congratis-frontend
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend · Rust + RethinkDB
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      rethinkdb:
        image: rethinkdb:2.4.4-bookworm-slim
        ports:
          - 28015:28015
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/28015'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Compile all backend targets
        run: cargo check --all-targets --locked
      - name: Lint backend
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run backend tests
        env:
          RETHINKDB_HOST: 127.0.0.1
          RETHINKDB_PORT: "28015"
          RETHINKDB_DB: congratis_ci
          RETHINKDB_TESTS: "1"
        run: cargo test --all-targets --locked
      - name: Check backend formatting
        run: cargo fmt --all -- --check
      - name: Verify RethinkDB Rust driver connection
        env:
          RETHINKDB_HOST: 127.0.0.1
          RETHINKDB_PORT: "28015"
        run: cargo run --locked --bin rethinkdb-probe

  security:
    name: Security · Cargo Audit
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit backend dependencies
        run: cargo audit --file Cargo.lock
      - name: Audit WASM frontend dependencies
        run: cargo audit --file web/Cargo.lock

  infrastructure:
    name: Infrastructure · Compose + Nginx
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh && sh -n deploy/nginx/entrypoint.sh
      - name: Prepare Compose validation environment
        run: |
          cp .env.example .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
      - name: Validate production Compose configuration
        run: docker compose config --quiet
      - name: Build Nginx edge image
        run: docker compose build nginx
      - name: Prepare isolated Nginx test override
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            nginx:
              extra_hosts:
                - "app:127.0.0.1"
          EOF
      - name: Validate Nginx bootstrap configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --no-deps --rm -e NGINX_TEST_ONLY=1 nginx
      - name: Validate Nginx TLS configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --no-deps --rm -e NGINX_TEST_ONLY=1 -e NGINX_FORCE_HTTPS=1 nginx

  production:
    name: Production · Full Docker stack
    needs: changes
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/dominator-spa' && (needs.changes.outputs.infrastructure == 'true' || needs.changes.outputs.backend == 'true'))) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' && github.base_ref == 'main' && (needs.changes.outputs.infrastructure == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production application image
        run: docker build --tag congratis:ci .
      - name: Prepare Compose validation environment
        run: |
          cp .env.example .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          # GitHub-hosted runners may already have services bound to 80/443.
          # Keep the production defaults but isolate the smoke-test ports.
          printf '\nHTTP_PORT=18080\nHTTPS_PORT=18443\n' >> .env
      - name: Validate production Compose configuration
        run: docker compose config --quiet
      - name: Tag application image for Compose
        run: docker tag congratis:ci congratis:rethinkdb
      - name: Prepare disposable administrator credentials
        run: |
          ADMIN_HASH="$(docker run --rm -e ADMIN_PASSWORD='CI-Only-Admin-Password-2026' congratis:rethinkdb hash-admin-password)"
          sed -i "s|^ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH='$ADMIN_HASH'|" .env
      - name: Build Nginx edge image
        run: docker compose build nginx
      - name: Validate Nginx bootstrap configuration
        run: docker compose run --rm -e NGINX_TEST_ONLY=1 nginx
      - name: Validate Nginx TLS configuration
        run: docker compose run --rm -e NGINX_TEST_ONLY=1 -e NGINX_FORCE_HTTPS=1 nginx
      - name: Smoke-test running Nginx reverse proxy
        run: |
          docker compose up -d nginx
          for attempt in $(seq 1 30); do
            if docker compose exec -T nginx wget -q -O /dev/null http://127.0.0.1/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs nginx app rethinkdb
              exit 1
            fi
            sleep 2
          done
      - name: Verify frontend cache headers and fingerprinted URLs
        env:
          BASE_URL: http://127.0.0.1:18080
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error --dump-header "$headers" --output "$body" "$BASE_URL/"
          grep -Eiq '^Cache-Control: no-store' "$headers"
          css_path="$(grep -Eo 'href="[^"]*style\.css\?v=[a-f0-9]{16}"' "$body" | head -n1 | cut -d '"' -f2)"
          js_path="$(grep -Eo 'src="[^"]*index\.js\?v=[a-f0-9]{16}"' "$body" | head -n1 | cut -d '"' -f2)"
          test -n "$css_path"
          test -n "$js_path"
          curl --fail --silent --show-error --head "$BASE_URL/$css_path" | grep -Eiq '^Cache-Control: public, max-age=31536000, immutable'
          curl --fail --silent --show-error --head "$BASE_URL/$js_path" | grep -Eiq '^Cache-Control: public, max-age=31536000, immutable'
      - name: Exercise real backend HTTP API
        env:
          BASE_URL: http://127.0.0.1:18080
        run: bash deploy/scripts/smoke-test-api.sh
      - name: Stop Compose stack
        if: always()
        run: if [ -f .env ]; then docker compose down --volumes --remove-orphans; fi

  ci:
    name: CI · Required checks
    if: always()
    needs:
      - changes
      - frontend
      - backend
      - security
      - infrastructure
      - production
    runs-on: ubuntu-latest
    steps:
      - name: Verify relevant checks
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          SECURITY: ${{ needs.security.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          PRODUCTION: ${{ needs.production.result }}
        run: |
          for result in "$CHANGES" "$FRONTEND" "$BACKEND" "$SECURITY" "$INFRASTRUCTURE" "$PRODUCTION"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required CI job failed or was cancelled."
              exit 1
            fi
          done
          echo "All checks required for the changed components have passed."
