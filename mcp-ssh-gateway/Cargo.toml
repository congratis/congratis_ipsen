[package]
name = "congratis-mcp-ssh-gateway"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "congratis-mcp-ssh-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
