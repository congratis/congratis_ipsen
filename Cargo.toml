[package]
name = "christmas-greetings"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
rand = "0.8"
reql = "=0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "christmas-greetings"
path = "src/main.rs"

[[bin]]
name = "generate-tokens"
path = "src/bin/generate_tokens.rs"

[[bin]]
name = "rethinkdb-probe"
path = "src/bin/rethinkdb_probe.rs"

[[bin]]
name = "hash-admin-password"
path = "src/bin/hash_admin_password.rs"

[[bin]]
name = "rethinkdb-reset"
path = "src/bin/rethinkdb_reset.rs"
