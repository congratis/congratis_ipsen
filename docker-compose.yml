services:
  rethinkdb:
    image: rethinkdb:2.4.4-bookworm-slim
    command: [rethinkdb, --bind, all, --no-http-admin, --initial-password, ${RETHINKDB_PASSWORD:?Set RETHINKDB_PASSWORD in .env}]
    restart: unless-stopped
    volumes: [rethinkdb_data:/data]
    expose: ["28015"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/28015'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: congratis:rethinkdb
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      RETHINKDB_HOST: rethinkdb
      RETHINKDB_PORT: "28015"
      RETHINKDB_USER: admin
      RETHINKDB_PASSWORD: ${RETHINKDB_PASSWORD:?Set RETHINKDB_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      rethinkdb:
        condition: service_healthy
    expose: ["8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    networks: [data, app_internal]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: congratis-nginx:1.30.8
    restart: unless-stopped
    init: true
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      app:
        condition: service_started
    ports: ["80:80", "443:443"]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=0,gid=101,mode=0770
      - /var/run:rw,noexec,nosuid,size=4m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && nginx -t >/dev/null 2>&1 && wget -q -O /dev/null http://app:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [app_internal, edge]

  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [tools]
    volumes: [letsencrypt:/etc/letsencrypt, acme_webroot:/var/www/certbot]
    command: [renew, --webroot, --webroot-path, /var/www/certbot, --quiet]
    networks: [edge]

  rethinkdb-probe:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [tools]
    command: [rethinkdb-probe]
    environment:
      RETHINKDB_HOST: rethinkdb
      RETHINKDB_PORT: "28015"
      RETHINKDB_USER: admin
      RETHINKDB_PASSWORD: ${RETHINKDB_PASSWORD:?Set RETHINKDB_PASSWORD in .env}
    depends_on:
      rethinkdb:
        condition: service_healthy
    networks: [data]

volumes:
  rethinkdb_data:
  letsencrypt:
  acme_webroot:

networks:
  data:
    internal: true
  app_internal:
    internal: true
  edge:
