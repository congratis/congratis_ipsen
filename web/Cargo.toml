[package]
name = "congratis-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dominator = "0.5.38"
futures-signals = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "EventSource", "Event", "MessageEvent", "HtmlInputElement", "HtmlTextAreaElement", "HtmlAudioElement", "HtmlMediaElement", "HtmlElement", "Element", "EventTarget", "Node", "console"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
